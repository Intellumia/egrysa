name: Release image
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the release commit on main
        if: github.event_name == 'push'
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with: { deno-version: "2.9.4" }
      - run: deno task check
      - run: deno task eval
      - run: deno audit
  dry-run:
    name: Dry-run release build, scan, and SBOM
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Set non-publishing candidate tag
        run: echo "IMAGE=egrysa:release-dry-run-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          load: true
          tags: ${{ env.IMAGE }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          scanners: vuln
      - name: Generate dry-run CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: cyclonedx
          output: sbom.cdx.json
          scanners: vuln
      - name: Retain dry-run SBOM as private workflow evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: egrysa-release-dry-run-${{ github.sha }}
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 7
  image:
    name: Build, scan, publish, and attest image
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # Publish the scanned image to GHCR.
      id-token: write # Request Sigstore and GitHub provenance identities.
      attestations: write # Publish GitHub build provenance for the image digest.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set immutable release tag
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          load: true
          tags: ${{ env.IMAGE }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          scanners: vuln
      - name: Generate CycloneDX SBOM from the scanned image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: cyclonedx
          output: sbom.cdx.json
          scanners: vuln
      - name: Push the exact image that passed scanning
        id: push
        run: |
          docker push "$IMAGE"
          REFERENCE="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")"
          DIGEST="${REFERENCE##*@}"
          test -n "$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "reference=$REFERENCE" >> "$GITHUB_OUTPUT"
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with: { deno-version: "2.9.4" }
      - name: Build standalone binaries for the package managers
        run: |
          # One self-contained executable per platform, with the gateway's
          # permissions compiled in, packaged beside the example
          # configurations and the licence so an install is usable on its own.
          # The permission flags come from the compile task rather than being
          # repeated here, so the two cannot drift; only the output path and
          # the target are supplied per platform. The hashes join SHA256SUMS
          # below, so a package manager that pins one pins an artefact the
          # signed manifest covers.
          FLAGS="$(deno eval 'const task = JSON.parse(Deno.readTextFileSync("deno.json")).tasks.compile; console.log(task.replace(/^deno compile /, "").replace(/ --output \S+ src\/main\.ts$/, ""))')"
          for TARGET in \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu; do
            rm -rf pkg
            mkdir -p pkg/egrysa
            # Cross-compiling downloads that platform's runtime. A stalled
            # download would otherwise hold the job until its timeout and
            # burn the tag, so bound each attempt and retry.
            for ATTEMPT in 1 2 3; do
              rm -f pkg/egrysa/egrysa pkg/egrysa/egrysa.tmp-*
              if timeout 300 deno compile $FLAGS --target "$TARGET" --output pkg/egrysa/egrysa src/main.ts; then
                break
              fi
              if [ "$ATTEMPT" = 3 ]; then
                echo "compiling for $TARGET failed or stalled three times" >&2
                exit 1
              fi
              echo "compiling for $TARGET failed or stalled; retrying" >&2
              sleep 10
            done
            cp -r config pkg/egrysa/
            cp LICENSE README.md pkg/egrysa/
            tar -czf "egrysa-${GITHUB_REF_NAME}-${TARGET}.tar.gz" -C pkg egrysa
          done
          rm -rf pkg
          ls -l egrysa-*.tar.gz
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: { cosign-release: "v3.0.6" }
      - name: Sign image by immutable digest
        env:
          REFERENCE: ${{ steps.push.outputs.reference }}
        run: |
          cosign sign --yes --bundle cosign-signature.bundle.json "$REFERENCE"
      - id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Verify and retain release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REFERENCE: ${{ steps.push.outputs.reference }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          PROVENANCE_URL: ${{ steps.provenance.outputs.attestation-url }}
        run: |
          IDENTITY="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          SIGNER_WORKFLOW="${GITHUB_REPOSITORY}/.github/workflows/release.yml"
          cp "$PROVENANCE_BUNDLE" provenance.bundle.jsonl

          cosign verify \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --output json \
            --output-file cosign-signature-verification.json \
            "$REFERENCE"
          gh attestation verify "oci://${REFERENCE}" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle provenance.bundle.jsonl \
            --signer-workflow "$SIGNER_WORKFLOW" \
            --source-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --format json > github-provenance-verification.json

          cosign sign-blob --yes --bundle sbom.cdx.sigstore.json sbom.cdx.json
          cosign verify-blob \
            --bundle sbom.cdx.sigstore.json \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            sbom.cdx.json

          printf '%s\n' \
            "tag=${GITHUB_REF_NAME}" \
            "source_commit=${GITHUB_SHA}" \
            "image=${REFERENCE}" \
            "github_attestation=${PROVENANCE_URL}" \
            > release-evidence.txt
          sha256sum \
            egrysa-*.tar.gz \
            sbom.cdx.json \
            sbom.cdx.sigstore.json \
            provenance.bundle.jsonl \
            cosign-signature.bundle.json \
            cosign-signature-verification.json \
            github-provenance-verification.json \
            release-evidence.txt \
            > SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          cosign verify-blob \
            --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS
      - name: Retain verifiable release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: egrysa-release-evidence-${{ github.ref_name }}
          path: |
            egrysa-*.tar.gz
            sbom.cdx.json
            sbom.cdx.sigstore.json
            provenance.bundle.jsonl
            cosign-signature.bundle.json
            cosign-signature-verification.json
            github-provenance-verification.json
            release-evidence.txt
            SHA256SUMS
            SHA256SUMS.sigstore.json
          if-no-files-found: error
          retention-days: 90
  publish:
    name: Verify the evidence, publish, and verify again
    if: github.event_name == 'push'
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # Create the GitHub release and attach the evidence.
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: egrysa-release-evidence-${{ github.ref_name }}
          path: evidence
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: { cosign-release: "v3.0.6" }
      - name: Verify the retained evidence before anything is published
        run: tools/verify-release.sh "$GITHUB_REF_NAME" --from-dir evidence
      - name: Verify the tag signature
        run: |
          set -euo pipefail
          # Tags cut from GitHub are signed keylessly by the Cut release
          # workflow and must verify against that identity. Earlier tags carry
          # a maintainer's SSH signature, which GitHub shows as verified.
          git fetch --no-tags origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if git cat-file tag "$GITHUB_REF_NAME" | grep -q -- "-----BEGIN SIGNED MESSAGE-----"; then
            mkdir -p "$RUNNER_TEMP/bin"
            curl -fsSL -o "$RUNNER_TEMP/bin/gitsign" \
              https://github.com/sigstore/gitsign/releases/download/v0.17.1/gitsign_0.17.1_linux_amd64
            echo "69213a8a0813a151e5a47d0060862952ff833a845d57309dff76f7ba6600abae  $RUNNER_TEMP/bin/gitsign" | sha256sum -c -
            chmod +x "$RUNNER_TEMP/bin/gitsign"
            "$RUNNER_TEMP/bin/gitsign" verify-tag "$GITHUB_REF_NAME" \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/cut-release.yml@refs/heads/main" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            echo "TAG_SIGNATURE=Signed keylessly by the Cut release workflow on main; verified with \`gitsign verify-tag\` before publication." >> "$GITHUB_ENV"
          else
            echo "TAG_SIGNATURE=Signed by a maintainer's SSH key." >> "$GITHUB_ENV"
          fi
      - name: Write the release notes
        run: |
          set -euo pipefail
          SOURCE="$(sed -n 's/^source_commit=//p' evidence/release-evidence.txt)"
          IMAGE="$(sed -n 's/^image=//p' evidence/release-evidence.txt)"
          ATTESTATION="$(sed -n 's/^github_attestation=//p' evidence/release-evidence.txt)"
          CI_RUN="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --limit 50 \
            --json databaseId,headSha --jq "[.[] | select(.headSha == \"${SOURCE}\")][0].databaseId // empty")"
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          {
            if [ -f "$NOTES" ]; then cat "$NOTES"; else printf '# Egrysa %s\n\nSee CHANGELOG.md for what changed.\n' "$GITHUB_REF_NAME"; fi
            printf '\n## Verify the release\n\n'
            printf -- '- Tag: `%s`. %s\n' "$GITHUB_REF_NAME" "$TAG_SIGNATURE"
            printf -- '- Source commit: [`%s`](https://github.com/%s/commit/%s)\n' "$SOURCE" "$GITHUB_REPOSITORY" "$SOURCE"
            [ -n "$CI_RUN" ] && printf -- '- Protected-main CI: [run %s](https://github.com/%s/actions/runs/%s)\n' "$CI_RUN" "$GITHUB_REPOSITORY" "$CI_RUN"
            printf -- '- Tagged release pipeline: [run %s](https://github.com/%s/actions/runs/%s)\n' "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf -- '- Immutable image: `%s`\n' "$IMAGE"
            printf -- '- GitHub SLSA attestation: %s\n\n' "$ATTESTATION"
            printf 'The release workflow verified the retained evidence with `tools/verify-release.sh` before creating this release (7 of 7 checks). To repeat it:\n\n'
            printf '```sh\ntools/verify-release.sh %s\n```\n' "$GITHUB_REF_NAME"
          } > notes.md
      - name: Publish
        run: |
          set -euo pipefail
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag $PRERELEASE \
            --title "Egrysa ${GITHUB_REF_NAME}" --notes-file notes.md evidence/*
      - name: Verify again from the published release
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/published"
          ROOT="$PWD"
          (cd "$RUNNER_TEMP/published" && "$ROOT/tools/verify-release.sh" "$GITHUB_REF_NAME")
          sed -i 's/before creating this release (7 of 7 checks)/before creating this release, and again from the published release (7 of 7 checks both times)/' notes.md
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
  packages:
    name: Open the Homebrew and npm update
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: main, persist-credentials: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: egrysa-release-evidence-${{ github.ref_name }}
          path: evidence
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with: { deno-version: "2.9.4" }
      - name: Generate the formula and npm manifest from the verified evidence
        run: |
          set -euo pipefail
          deno task package:release --tag="$GITHUB_REF_NAME" --sums=evidence/SHA256SUMS
          deno eval '
            const tag = Deno.env.get("GITHUB_REF_NAME");
            const date = new Date().toISOString().slice(0, 10);
            const path = "docs/RELEASE.md";
            const lines = Deno.readTextFileSync(path).split("\n");
            const last = lines.findLastIndex((line) => line.startsWith("| `v"));
            if (last < 0) throw new Error("recorded results table not found");
            lines.splice(last + 1, 0, `| \`${tag}\` | ${date} | 7 of 7 checks passed from the retained artifact before publication, and again from the published release, both run by the release workflow |`);
            Deno.writeTextFileSync(path, lines.join("\n"));
          '
          deno fmt docs/RELEASE.md packaging
      - name: Open the pull request
        env:
          TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$TOKEN" ] || { echo "RELEASE_TAG_TOKEN is not set; run deno task package:release by hand." >&2; exit 1; }
          BRANCH="release/packages-${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add Formula/egrysa.rb packaging/npm/manifest.json packaging/npm/package.json docs/RELEASE.md
          git commit -m "packages: point Homebrew and npm at the verified ${GITHUB_REF_NAME} binaries"
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          GH_TOKEN="$TOKEN" gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "packages: point Homebrew and npm at the verified ${GITHUB_REF_NAME} binaries" \
            --body "Generated by the release workflow from the ${GITHUB_REF_NAME} evidence after \`tools/verify-release.sh\` passed against it before and after publication. Merging it makes \`brew install intellumia/egrysa/egrysa\` resolve to ${GITHUB_REF_NAME}. Publishing to npm stays a manual step."

# Trivy secret-scanning configuration for the security baseline.
#
# The corpora under evals/ contain deliberately credential-shaped strings, used to
# measure what the detector floor catches and misses. A fixture that a secret
# scanner ignores would not test anything, so these files necessarily trip secret
# scanning. The allowance is scoped to those two paths by name; every other file
# in the repository is scanned normally.
#
# Compensating controls: the fixture values are structurally non-functional by
# construction, the file is reviewed like any other source change, and GitHub
# push protection remains enabled across the repository.
allow-rules:
  - id: adversarial-detector-corpus
    description: Synthetic credential fixtures used to measure detector coverage.
    path: ^evals/adversarial\.jsonl$
  - id: scenario-detector-corpus
    description: Synthetic business documents used to measure realistic-traffic coverage.
    path: ^evals/scenarios\.jsonl$

# Trivy secret-scanning configuration for the security baseline.
#
# evals/adversarial.jsonl is a corpus of deliberately credential-shaped strings
# used by tools/adversarial_report.ts to measure what the detector floor catches
# and misses. A fixture that a secret scanner ignores would not test anything, so
# the file necessarily trips secret scanning. The allowance is scoped to that one
# path; every other file in the repository is scanned normally.
#
# Compensating controls: the fixture values are structurally non-functional by
# construction, the file is reviewed like any other source change, and GitHub
# push protection remains enabled across the repository.
allow-rules:
  - id: adversarial-detector-corpus
    description: Synthetic credential fixtures used to measure detector coverage.
    path: ^evals/adversarial\.jsonl$

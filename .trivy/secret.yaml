# Trivy secret-scanning configuration for the security baseline.
#
# The corpora under evals/ carry credential fixtures as seeded placeholders,
# {{rand:<alphabet>:<length>}}, expanded only when a corpus is loaded (see
# src/corpus.ts). The committed files therefore hold no token-shaped strings.
# What remains scanner-visible is the private-key envelopes, whose BEGIN/END
# headers are the value being tested and cannot be placeholders. The allowance
# is scoped to the two corpus paths by name; every other file is scanned
# normally.
#
# Compensating controls: the envelope bodies are placeholders, the files are
# reviewed like any other source change, and GitHub push protection remains
# enabled across the repository.
allow-rules:
  - id: adversarial-detector-corpus
    description: Synthetic credential fixtures used to measure detector coverage.
    path: ^evals/adversarial\.jsonl$
  - id: scenario-detector-corpus
    description: Synthetic business documents used to measure realistic-traffic coverage.
    path: ^evals/scenarios\.jsonl$

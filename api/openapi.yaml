openapi: 3.1.0
info:
  title: Egrysa Gateway API
  version: 0.1.0-alpha.3
  description: OpenAI-compatible text, streaming, and function-tool AI egress control boundary.
servers:
  - url: http://127.0.0.1:8787
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      security: []
      operationId: health
      responses:
        "200": { description: Process is alive }
  /readyz:
    get:
      security: []
      operationId: ready
      responses:
        "200": { description: Configuration loaded }
  /metrics:
    get:
      operationId: metrics
      responses:
        "200":
          description: Content-free Prometheus metrics
          content:
            text/plain: { schema: { type: string } }
  /v1/models:
    get:
      operationId: listModels
      responses:
        "200":
          description: OpenAI-compatible union of configured model allowlists
          content:
            application/json: { schema: { type: object } }
  /v1/messages:
    post:
      summary: Anthropic Messages API ingress
      description: |
        Accepts the Anthropic Messages request shape (system, text, tool_use and tool_result
        blocks, tools, tool_choice, stream, max_tokens, temperature, top_p) and runs the same
        policy, transformation, receipt, and provider pipeline as /v1/chat/completions.
        Answers as an Anthropic message object, as the Anthropic event stream, or as the Anthropic
        error object with a receipt_id field. top_k, stop_sequences, metadata, and non-text blocks
        are refused with 400. The x-egrysa-receipt and x-egrysa-decision headers are present.
      security: [{ bearer: [] }]
      responses:
        "200": { description: Anthropic message object or event stream }
        "400": { description: Anthropic error object, invalid_request_error }
        "403": { description: Anthropic error object, permission_error, with receipt_id }
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      parameters:
        - in: header
          name: x-egrysa-provider
          required: false
          schema: { type: string }
          description: Requested configured provider. Policy can override it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatRequest" }
      responses:
        "200":
          description: OpenAI-compatible JSON or SSE streaming response
          headers:
            x-egrysa-decision: { schema: { enum: [allow_raw, transform, local_only] } }
            x-egrysa-receipt: { schema: { type: string, format: uuid } }
            x-egrysa-downgraded:
              schema: { type: string }
              description: Comma-separated request fields dropped or emulated under the selected provider capability profile.
          content:
            application/json: { schema: { type: object } }
            text/event-stream: { schema: { type: string } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "504": { $ref: "#/components/responses/Problem" }
  /v1/receipts/{id}:
    get:
      operationId: getReceipt
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Content-minimized signed policy receipt
          content:
            application/json: { schema: { $ref: "#/components/schemas/Receipt" } }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/receipts/public-key:
    get:
      operationId: getReceiptPublicKey
      responses:
        "200": { description: Ed25519 SPKI public verification key }
  /v1/receipts/checkpoint:
    get:
      operationId: getReceiptCheckpoint
      responses:
        "200": { description: Signed receipt-chain head for external anchoring }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  responses:
    Problem:
      description: RFC 9457-style problem response
      content:
        application/json: { schema: { $ref: "#/components/schemas/Problem" } }
  schemas:
    ChatRequest:
      type: object
      additionalProperties: false
      required: [model, messages]
      properties:
        model: { type: string, minLength: 1, maxLength: 256 }
        messages:
          type: array
          minItems: 1
          maxItems: 256
          items:
            type: object
            additionalProperties: false
            required: [role, content]
            properties:
              role: { enum: [system, user, assistant, tool] }
              content: { type: [string, "null"] }
              name: { type: string }
              tool_call_id: { type: string }
              tool_calls: { type: array, items: { $ref: "#/components/schemas/ToolCall" } }
        stream: { type: boolean, default: false }
        stream_options:
          type: object
          additionalProperties: false
          properties:
            include_usage: { type: boolean }
        tools:
          type: array
          minItems: 1
          maxItems: 128
          items: { $ref: "#/components/schemas/Tool" }
        tool_choice: {}
        parallel_tool_calls: { type: boolean }
        temperature: { type: number, minimum: 0, maximum: 2 }
        max_tokens: { type: integer, minimum: 1, maximum: 1000000 }
        top_p: { type: number, minimum: 0, maximum: 1 }
        frequency_penalty: { type: number, minimum: -2, maximum: 2 }
        presence_penalty: { type: number, minimum: -2, maximum: 2 }
        seed: { type: integer }
    ToolCall:
      type: object
      required: [id, type, function]
      properties:
        id: { type: string }
        type: { const: function }
        function:
          type: object
          required: [name, arguments]
          properties:
            name: { type: string }
            arguments: { type: string, description: JSON object encoded as a string }
    Tool:
      type: object
      required: [type, function]
      properties:
        type: { const: function }
        function:
          type: object
          required: [name]
          properties:
            name: { type: string }
            description: { type: string }
            parameters: { type: object }
            strict: { type: boolean }
    Receipt:
      type: object
      required: [
        version,
        id,
        chainId,
        sequence,
        timestamp,
        workloadId,
        requestFingerprint,
        decision,
        provider,
        model,
        findingCounts,
        transformedFields,
        rawContentPersisted,
        providerStoreRequested,
        previousReceiptHash,
        receiptHash,
        signingKeyId,
        signature,
      ]
      properties:
        version:
          enum: ["2", "3", "4", "5"]
          description: Version 3 adds semantic-detector evidence; version 4 adds egress outcome for provider invocations; version 5 adds response-scan evidence.
        id: { type: string, format: uuid }
        chainId: { type: string }
        sequence: { type: integer, minimum: 1 }
        timestamp: { type: string, format: date-time }
        workloadId: { type: string }
        requestFingerprint: { type: string, pattern: "^[a-f0-9]{64}$" }
        decision: { enum: [allow_raw, transform, local_only, deny] }
        provider: { type: [string, "null"] }
        model: { type: string }
        findingCounts: { type: object, additionalProperties: { type: integer, minimum: 0 } }
        transformedFields: { type: integer, minimum: 0 }
        detectors:
          type: array
          description: Detector IDs and versions that ran. Present in version 3 and semantic-enabled version 4 receipts.
          items:
            type: object
            additionalProperties: false
            required: [id, version]
            properties:
              id: { type: string }
              version: { type: string }
        detectorDegraded:
          type: boolean
          description: True when semantic detection failed and no semantic findings were used.
        response:
          type: object
          description: Present and required for version 5. What the scan of the provider's response found, before recomposition, and what was done about it. Streams are signed before their text exists and record unscanned.
          additionalProperties: false
          required: [findingCounts, action]
          properties:
            findingCounts: { type: object, additionalProperties: { type: integer, minimum: 1 } }
            action: { enum: [none, redacted, denied, unscanned] }
        egress:
          enum: [completed, failed, started]
          description: Present and required for version 4. Native streaming receipts attest started egress; buffered emulation records completed upstream egress.
        rawContentPersisted: { const: false }
        providerStoreRequested: { const: false }
        previousReceiptHash: { type: [string, "null"] }
        receiptHash: { type: string, pattern: "^[a-f0-9]{64}$" }
        signingKeyId: { type: string }
        signature: { type: string, contentEncoding: base64 }
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        receiptId: { type: string, format: uuid }

apiVersion: v1
kind: ConfigMap
metadata:
  name: egrysa-config
  labels:
    app.kubernetes.io/name: egrysa
data:
  egrysa.json: |
    {
      "listen": { "hostname": "0.0.0.0", "port": 8787 },
      "maxRequestBytes": 1048576,
      "requestTimeoutMs": 60000,
      "receiptCapacity": 10000,
      "receiptLogPath": "/var/lib/egrysa/receipts.jsonl",
      "receiptChainId": "egrysa-kubernetes-alpha",
      "providers": [
        {
          "id": "openai",
          "kind": "openai",
          "baseUrl": "https://api.openai.com",
          "apiKeyEnv": "OPENAI_API_KEY",
          "allowedModels": ["gpt-5.2"],
          "dataPolicy": { "training": "disabled", "retention": "standard", "allowRaw": false }
        },
        {
          "id": "local",
          "kind": "openai-compatible",
          "baseUrl": "http://localhost:11434/v1",
          "allowedModels": ["REPLACE_WITH_LOCAL_MODEL"],
          "local": true,
          "dataPolicy": { "training": "unknown", "retention": "none", "allowRaw": true }
        }
      ],
      "policy": {
        "defaultProvider": "openai",
        "localProvider": "local",
        "blockKinds": ["credit_card", "private_key", "api_secret", "ssn", "aadhaar", "india_pan", "uk_nino", "nhs_number", "passport", "bank_account"],
        "localOnlyKinds": ["confidential_term"],
        "transformKinds": ["email", "phone", "ipv4", "iban", "ipv6", "mac_address", "date_of_birth", "crypto_wallet", "vin", "organization"],
        "sensitiveTerms": [{ "term": "REPLACE BEFORE DEPLOYMENT", "label": "confidential" }]
      }
    }
